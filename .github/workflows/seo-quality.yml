name: SEO et qualite du site
on:
  push:
    branches: [main, seo-preserve-sitemap-lastmod-2026-11]
  pull_request:
    branches: [main]
jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4
      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dependances
        run: npm ci --no-audit --no-fund
      - name: Verifier les tests fonctionnels et le sitemap
        run: npm test
      - name: Verifier les pages et liens internes
        run: python3 scripts/check.py
      - name: Verifier la regeneration SEO
        run: node scripts/build.cjs
      - name: Recontroler les pages et le sitemap genere
        run: |
          python3 scripts/check.py
          npm test
